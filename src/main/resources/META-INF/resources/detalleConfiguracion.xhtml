<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <h:form>

            <div class="card">
                <div class="ui-g ui-fluid">
                    <div class="ui-g-12">
                        <h1>#{msg.detailsConfiguracion}</h1>
                        <p:panelGrid columns="2"  layout="tabular">

                            <h:outputLabel value="#{msg.id}:" />
                            <h:outputText value="#{configuracionMB.id}"/>
                            <h:outputLabel value="#{msg.llave}:" />
                            <h:outputText value="#{configuracionMB.llave}"/>
                            <h:outputLabel value="#{msg.valor}:" />
                            <h:outputText value="#{configuracionMB.valor}"/>
                        </p:panelGrid>
                    </div>
                </div>
                <p:commandButton id="volver" icon="fa fa-chevron-left" value="#{msg.volver}" action="configuracionConf" actionListener="#{configuracionMB.limpiar()}" immediate="true" ajax="true" update="@form" />
            </div>
        </h:form>
        <h:inputHidden value="#{configuracionMB.id}"/>
    </ui:define>

</ui:composition>
