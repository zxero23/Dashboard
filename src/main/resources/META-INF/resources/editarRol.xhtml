<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" template="/WEB-INF/template.xhtml">

	<ui:define name="content">
		<h:form>

			<div class="card">
				<div class="ui-g ui-fluid">
					<div class="ui-g-12">
						<p:panelGrid columns="1" styleClass="ui-panelgrid-blank"
							layout="grid">

							<h1>#{msg.editRol}</h1>
							<p:outputLabel value="#{msg.nombre}:" for="nombre" />
							<p:inputText id="nombre" value="#{rolMB.nombre}"
								label="#{msg.nombre}" required="true">
								<p:ajax update="@this nombreError" />
							</p:inputText>
							<p:message id="nombreError" for="nombre" />
							<p:outputLabel value="#{msg.descripcion}:" for="descripcion" />
							<p:inputText id="descripcion"
								value="#{rolMB.descripcion}" label="#{msg.descripcion}"
								required="true">
								<p:ajax update="@this descripcionError" />
							</p:inputText>
							<p:message id="descripcionError" for="descripcion" />
							<p:outputLabel value="#{msg.permisos}:"
								for="pickListPermisos" />
							<p:pickList id="pickListPermisos"
								value="#{rolMB.dualListPermisos}" var="permiso"
								itemLabel="#{permiso.nombre}" itemValue="#{permiso}"
								converter="SEConverter">
								<f:facet name="sourceCaption">#{msg.permisoD}</f:facet>
								<f:facet name="targetCaption">#{msg.permisoS}</f:facet>
								<p:ajax update="pickListPermisosMsg" event="transfer" />
							</p:pickList>
							<p:message id="pickListPermisosMsg" for="pickListPermisos" />
							<p:outputLabel value="#{msg.menus}:" for="pickListMenus" />
							<p:pickList id="pickListMenus"
								value="#{rolMB.dualListMenus}" var="menu"
								itemLabel="#{menu.nombre}" itemValue="#{menu}"
								converter="SEConverter">
								<f:facet name="sourceCaption">#{msg.menuD}</f:facet>
								<f:facet name="targetCaption">#{msg.menuS}</f:facet>
								<p:ajax update="pickListMenusMsg" event="transfer" />
							</p:pickList>
							<p:message id="pickListMenusMsg" for="pickListMenus" />
						</p:panelGrid>
					</div>
				</div>
				<div class="p-formgroup-inline">
					<div class="p-field">
						<p:commandButton id="save" value="#{msg.save}"
							icon="fa fa-floppy-o" action="#{rolMB.guardarEdicion()}"
							ajax="true" update="@form" />
					</div>
					<div class="p-field">
						<p:commandButton id="cancel" icon="fa fa-ban"
							value="#{msg.cancel}" action="rolConf"
							actionListener="#{rolMB.limpiar()}" immediate="true"
							ajax="true" update="@form" />
					</div>
				</div>
			</div>
			<h:inputHidden value="#{rolMB.id}" />
		</h:form>

	</ui:define>

</ui:composition>
