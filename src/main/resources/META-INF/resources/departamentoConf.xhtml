<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" template="/WEB-INF/template.xhtml">
    <ui:define name="title">#{msg.confDepartamento}</ui:define>
	<ui:define name="content">
		<div class="card">
			<h1 class="lightBlack">#{msg.confDepartamento}</h1>

			<h:form id="formDepartamento" title=" ">
				<div class="p-formgroup-inline">
					<div class="p-field">
						<p:commandButton action="departamentoConf" icon="fa fa-refresh"
							actionListener="#{departamentoMB.actualizar}"
							value="#{msg.actualizar}" ajax="true" update="@form" />
					</div>
					<div class="p-field">
						<p:commandButton action="nuevoDepartamento" icon="fa fa-plus"
							value="#{msg.newDepartamento}" rendered="#{departamentoMB.alta}"
							ajax="true" update="@form" />
					</div>
				</div>

				<p:panel id="panelBusquedaDepartamento" header="#{msg.busqueda}"
					toggleable="true" toggleSpeed="200" collapsed="true"
					class="ui-fluid">
					<p:hotkey bind="enter"
						actionListener="#{municipioMB.aplicarFiltro}" />
					<div class="p-field">
						<p:outputLabel value="#{msg.nombre}:" for="departamento"
							styleClass="p-col-fixed" />
						<p:inputText id="departamento"
							value="#{departamentoMB.nombreBuscar}" />
					</div>
					<div class="p-formgroup-inline">
						<div class="p-field">
							<p:commandButton value="#{msg.find}" icon="fa fa-search"
								actionListener="#{departamentoMB.aplicarFiltro}" ajax="true"
								update="@form" />
						</div>
						<div class="p-field">
							<p:commandButton value="#{msg.actualizar}" icon="fa fa-refresh"
								actionListener="#{departamentoMB.actualizar}" ajax="true"
								update="@form" />
						</div>
					</div>


				</p:panel>

				<p:dataTable id="departamentoDataTable"
					value="#{departamentoMB.listElements}" var="item" lazy="true"
					reflow="true" paginator="true" paginatorPosition="bottom" rows="10"
					class="panel-buttons" first="#{departamentoMB.page}"
					paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
					currentPageReportTemplate="#{msg.currentPageReportTemplate}">

					<p:column id="nombre" headerText="#{msg.nombre}">
						<h:outputText id="cellNombre" value="#{item.nombre}" />
					</p:column>

					<p:column id="permisos" headerText="Permisos">
						<div class="p-formgroup-inline">
							<div class="p-field">
								<p:commandButton id="detalle" p:title="Detalle"
									onclick="detalleDepartamento([{name:'id', value:'#{item.id}'}]);"
									icon="fa fa-search-plus" rendered="#{departamentoMB.detalle}">
								</p:commandButton>
							</div>
							<div class="p-field">
								<p:commandButton id="editar" p:title="Editar" icon="fa fa-edit"
									onclick="editarDepartamento([{name:'id', value:'#{item.id}'}]);"
									rendered="#{departamentoMB.modificacion}" />
							</div>
							<div class="p-field">
								<p:commandButton id="eliminar" p:title="Eliminar"
									onclick="eliminarDepartamento([{name:'id', value:'#{item.id}'}]);"
									rendered="#{departamentoMB.baja}" icon="fa fa-trash">
									<p:confirm header="#{msg.confirm}" message="#{msg.msgDelete}"
										icon="ui-icon-alert" />
								</p:commandButton>
							</div>
						</div>
						<p:confirmDialog global="true" showEffect="fade" hideEffect="fade"
							closable="false">
							<p:commandButton id="_yes" value="#{msg.acep}" type="button"
								styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
							<p:commandButton id="_no" value="#{msg.cancel}" type="button"
								styleClass="ui-confirmdialog-no" icon="ui-icon-close"
								ajax="true" update="@form" />
						</p:confirmDialog>
					</p:column>
				</p:dataTable>
				<p:remoteCommand name="detalleDepartamento"
					actionListener="#{departamentoMB.verDetalle()}"
					action="detalleDepartamento" process="@this" update="@form" />
				<p:remoteCommand name="editarDepartamento"
					actionListener="#{departamentoMB.prepararParaEditar()}"
					action="editarDepartamento" process="@this" update="@form" />
				<p:remoteCommand name="eliminarDepartamento"
					actionListener="#{departamentoMB.guardarBorrado()}"
					action="departamentoConf" process="@this" update="@form" />

			</h:form>
		</div>


	</ui:define>

</ui:composition>
