<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" template="/WEB-INF/template.xhtml">

	<ui:define name="content">
		<h:form>

			<div class="card">
				<div class="ui-g ui-fluid">
					<div class="ui-g-12">
						<h1>#{msg.detailsRol}</h1>
						<p:panelGrid columns="2" layout="tabular">

							<h:outputLabel value="#{msg.id}:" />
							<h:outputText value="#{rolMB.id}" />
							<h:outputLabel value="#{msg.nombre}:" />
							<h:outputText value="#{rolMB.nombre}" />
							<h:outputLabel value="#{msg.descripcion}:" />
							<h:outputText value="#{rolMB.descripcion}" />
						</p:panelGrid>
					</div>
				</div>
				<p:commandButton id="volver" icon="fa fa-chevron-left"
					value="#{msg.volver}" action="rolConf"
					actionListener="#{rolMB.limpiar()}" immediate="true"
					ajax="true" update="@form" />
			</div>
			<h:inputHidden value="#{rolMB.id}" />
		</h:form>

	</ui:define>

</ui:composition>
