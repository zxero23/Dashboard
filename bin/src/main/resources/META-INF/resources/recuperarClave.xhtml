<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui">

	<h:head>
		<f:facet name="first">
			<meta http-equiv="X-UA-Compatible" content="IE=edge" />
			<meta http-equiv="Content-Type"
				content="text/html; charset=UTF-8" />
			<meta name="viewport"
				content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
			<meta name="apple-mobile-web-app-capable" content="yes" />
			<link href="css/configs.css" rel="stylesheet" type="text/css" />
			<link rel="shortcut icon" type="image/x-icon"
				href="#{request.contextPath}/images/favicon.ico" />
		</f:facet>
		<title>#{msg.sys}</title>
	</h:head>

	<h:body>
		<h:form styleClass="login-body">
			<div class="login-panel ui-fluid">
				<div class="p-grid">
					<div class="p-col-12 logo-container">
						<p:graphicImage name="images/logo.svg"
							library="verona-layout" style="width: 250px;" />
						<p>#{msg.recuperarClaveMsg}</p>
					</div>
					<div class="p-col-12">
						<p:inputText id="usuario"
							value="#{webMB.usuarioRecuperarClave}"
							placeholder="#{msg.usuario}" required="true" />
					</div>
					<div class="p-col-12">
						<p:inputText id="correo"
							value="#{webMB.correoRecuperarClave}" type="email"
							placeholder="#{msg.correo}" required="true" />
					</div>
					<p:growl id="growl" showDetail="true" />
					<div class="p-grid">
						<div class="p-col">
							<div class="card grid-item">
								<p:commandButton id="send" update="@form"
									ajax="true" action="#{webMB.recuperarClave()}" value="#{msg.enviarClave}"
									icon="fa fa-paper-plane" class="ui-button-info rounded-button ui-button-raised" />
							</div>
						</div>
						<div class="p-col">
							<div class="card grid-item">
								<p:commandButton id="cancel" update="@form" class="ui-button-danger rounded-button ui-button-raised"
									ajax="true" action="index" actionListener="#{rolMB.limpiar()}"
									value="#{msg.cancel}" icon="fa fa-ban" immediate="true" />
							</div>
						</div>
					</div>

					<div class="p-col-12">
						<span>#{msg.author} - #{msg.footer}</span>
					</div>
				</div>
			</div>
		</h:form>
		<h:outputStylesheet name="css/layout-blue.css"
			library="verona-layout" />
	</h:body>

</html>
