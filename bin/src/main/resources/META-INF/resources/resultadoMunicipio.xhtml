<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="content">
        <h:form>

            <div class="card">
                <h1>#{municipioMB.title}</h1>
                <div class="ui-g ui-fluid panel-mensaje">
                    <h:panelGrid columns="2" cellpadding="5" cellspacing="5">
                        <i class="#{municipioMB.images}" />
                        <p:outputLabel value="#{municipioMB.msgSuccessError}"/>
                    </h:panelGrid>
                </div>
                <p:commandButton id="volver" icon="fa fa-chevron-left" value="#{msg.volver}" action="municipioConf" actionListener="#{municipioMB.limpiar()}" immediate="true" ajax="true" update="@form" />
            </div>
        </h:form>
    </ui:define>

</ui:composition>
